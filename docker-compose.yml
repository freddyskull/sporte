services:
  pocketbase:
    build:
      context: ./dbserve
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    volumes:
      - ./dbserve/pb_data:/pb/pb_data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_POCKETBASE_URL=${VITE_POCKETBASE_URL:-http://localhost:8090}
    ports:
      - "8081:80"
    depends_on:
      - pocketbase
    restart: unless-stopped
